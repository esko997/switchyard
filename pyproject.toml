[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "switchyard-control"
version = "0.1.0"
description = "An observation and planning desk for heterogeneous devices"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "switchyard/static/FONT-LICENSES.txt"]
dependencies = ["mcp>=1.26,<2", "pydantic>=2.11,<3"]

[project.scripts]
switchyard = "switchyard.cli:main"
switchyard-mcp = "switchyard.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["switchyard"]

[tool.uv]
package = true
